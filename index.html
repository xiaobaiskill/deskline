<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deskline · 英语壁纸</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f3ecdf'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' font-family='Georgia' fill='%23181614'%3ED%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true">D</span>
      <strong>Deskline</strong>
    </div>
    <div class="top-actions">
      <button type="button" class="btn" id="preview">预览</button>
      <button type="button" class="btn" id="download">下载</button>
      <button type="button" class="btn primary" id="apply" title="交给本机助手设为桌面（⌘↩）">更换屏幕</button>
      <select id="lang" class="menu-select lang-select" aria-label="语言">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </div>
  </header>

  <div class="workspace">
    <aside class="side panel">
      <section class="panel-block">
        <h2 id="screenHeading">屏幕设置</h2>
        <select id="screenSize" class="menu-select screen-select"></select>
        <form class="custom-size" id="customSize" hidden>
          <input id="customW" inputmode="numeric" aria-label="宽度" />
          <span>×</span>
          <input id="customH" inputmode="numeric" aria-label="高度" />
          <button type="submit" class="btn" id="useCustom">使用</button>
        </form>
        <p id="meta">按你的屏幕尺寸生成壁纸</p>
      </section>
      <section class="panel-block">
        <h2 id="wordsHeading">海外单词</h2>
        <div class="deck-row">
          <button type="button" class="btn" id="addJunior">初中 1500</button>
          <button type="button" class="btn" id="addSenior">高中 2000</button>
        </div>
      </section>
      <section class="panel-block editor-panel">
        <h2 id="textHeading">文本</h2>
        <div class="text-add">
          <button type="button" class="btn" id="addText">文本</button>
          <button type="button" class="btn" id="addLine">句子</button>
        </div>
        <div class="format" id="format" aria-label="文字格式">
          <button type="button" class="tool" id="bold" title="加粗 ⌘B">B</button>
          <button type="button" class="tool italic" id="italic" title="斜体 ⌘I">I</button>
          <button type="button" class="tool under" id="underline" title="下划线 ⌘U">U</button>
          <div class="swatches" id="inkSwatches"></div>
          <div class="swatches" id="markSwatches"></div>
          <div class="sizes" id="fontSizes"></div>
          <button type="button" class="tool" id="alignLeft" title="靠左">左</button>
          <button type="button" class="tool" id="alignCenter" title="居中">中</button>
          <button type="button" class="tool" id="plateBare" title="只有文字">无底</button>
          <button type="button" class="tool" id="plateGlass" title="半透明卡片">玻璃</button>
          <button type="button" class="tool" id="platePaper" title="纸卡片">纸</button>
          <button type="button" class="tool danger" id="remove">删除</button>
          <button type="button" class="tool" id="samples">示例</button>
        </div>
      </section>
    </aside>

    <main id="stage" class="panel">
      <div id="scaler">
        <div id="board">
          <div class="placeholder" id="placeholder" hidden>双击文字开始修改<br />拖动即可摆到任意位置</div>
        </div>
      </div>
    </main>
  </div>

  <footer class="dock">
    <button type="button" class="bg-nav prev" id="bgPrev" aria-label="上一张背景">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <p class="bg-caption" id="bgCaption"></p>
    <div class="film" id="film" aria-label="背景"></div>
    <button type="button" class="bg-nav next" id="bgNext" aria-label="下一张背景">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </footer>

  <div id="toast" hidden role="status"></div>
  <script src="app.js"></script>
</body>
</html>
